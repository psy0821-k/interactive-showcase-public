name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: 의존성 설치
        run: bun install --frozen-lockfile

      - name: 빌드 (타입 체크 포함)
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: 포맷 검사
        run: bun run format:check

      - name: 맞춤법 검사
        run: bun run spell

      - name: 단위 테스트
        run: bun run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: 의존성 설치
        run: bun install --frozen-lockfile

      - name: Playwright 브라우저 설치
        run: bunx playwright install --with-deps chromium

      - name: E2E 테스트
        run: bun run test:e2e

      - name: axe 접근성 전수 스캔 (71개 페이지)
        run: bun run test:a11y

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
